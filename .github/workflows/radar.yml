name: Coleta oficial e validação
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/radar.yml'
permissions:
  contents: read
concurrency:
  group: radar-cascavel
  cancel-in-progress: false
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar filtros de escopo
        run: python scripts/diagnostico_escopo.py
      - name: Coletar bases iniciais sem dados pessoais
        run: python scripts/coleta_escopo.py
      - name: Guardar diagnóstico e bases completas por etapa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coleta-escopo
          path: |
            scope-report.json
            staging/*.json
          if-no-files-found: ignore
          retention-days: 30
