name: Coleta oficial e validação
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/coletar.py'
      - '.github/workflows/radar.yml'
permissions:
  contents: read
concurrency:
  group: radar-cascavel
  cancel-in-progress: false
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Coletar e validar (falha impede publicação)
        run: python scripts/coletar.py
      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico
          path: candidate-counts.json
          if-no-files-found: ignore
